<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ensalum | Minha agenda</title>
  <link rel="stylesheet" href="agenda.css">
</head>
<body>
  <header class="cabecalho">
    <div class="marca">
      <div class="nome-projeto">Ensalum</div>
      <div class="pagina-atual">· Agenda</div>
    </div>
    <div class="perfil-professor" aria-label="Perfil do professor">
      <div class="foto-professor">WGS</div>
      <span class="nome-professor">Prof. William Geraldo Sallum</span>
    </div>
  </header>

<aside class="sidebar" aria-label="Menu lateral">
  <a class="link-sidebar menu-ativado" href="../menu/index.html" aria-label="Menu principal" title="Menu principal"><span class="sidebar-icon" aria-hidden="true">☰</span><span class="sidebar-label">Menu</span></a>
  <a class="link-sidebar" href="../menu/index.html" aria-label="Salas" title="Salas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20h14M7 20V5l10-2v17M10 8h1m3-1h1m-5 5h1m3-1h1m-4 9v-5h3v5"/></svg><span class="sidebar-label">Salas</span></a>
  <a class="link-sidebar" href="../busca/busca.html" aria-label="Busca de salas" title="Busca de salas"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><span class="sidebar-label">Busca de salas</span></a>
  <a class="link-sidebar ativado" href="../agenda/agenda.html" aria-label="Minha Agenda" title="Minha Agenda"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="1"/><path d="M8 3v4m8-4v4M4 9h16M8 12h2m4 0h2m-8 4h2m4 0h2"/></svg><span class="sidebar-label">Minha Agenda</span></a>
  <a class="link-sidebar" href="../reserva/reserva.html" aria-label="Nova reserva" title="Nova reserva"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM8 3v4m8-4v4M4 9h16M8 13h3m2 0h3"/></svg><span class="sidebar-label">Nova reserva</span></a>
  <div class="sidebar-bottom">
    <a class="link-sidebar" href="#" aria-label="Ajuda" title="Ajuda"><span class="sidebar-icon" aria-hidden="true">?</span><span class="sidebar-label">Ajuda</span></a>
    <a class="link-sidebar" href="#" aria-label="Perfil" title="Perfil"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.2"/><path d="M5.5 20c.5-3.5 2.8-5.5 6.5-5.5s6 2 6.5 5.5"/></svg><span class="sidebar-label">Perfil</span></a>
  </div>
</aside>

  <main class="main-content agenda-content">
    <div class="agenda-heading">
      <div>
        <h1>Minha agenda</h1>
        <p class="subtitulo">Visualize suas reservas de salas ao longo da semana.</p>
      </div>
      <a class="btn-primary" href="../reserva/reserva.html">＋ Nova reserva</a>
    </div>

    <section class="calendar-toolbar" aria-label="Resumo da agenda semanal">
      <div class="week-navigation">
        <button class="nav-week" id="prev-week" type="button" aria-label="Semana anterior">‹</button>
        <button class="nav-week" id="next-week" type="button" aria-label="Próxima semana">›</button>
        <strong id="week-range">19 - 25 outubro, 2026</strong>
        <span class="week-number" id="week-number">SEMANA 43</span>
      </div>
      <div class="calendar-summary">
        <span><strong id="total-bookings">0 reservas</strong> nesta semana</span>
        <span class="summary-divider"></span>
        <span class="muted"><strong id="total-hours">0 horas</strong> reservadas</span>
        <div class="legend">
          <span><i class="legend-square reserved"></i> Sua reserva</span>
          <span><i class="legend-square empty"></i> Sem reserva</span>
        </div>
      </div>
    </section>

    <section class="calendar-wrap" aria-label="Calendário semanal">
      <div class="calendar-grid" id="calendar-grid"></div>
    </section>
  </main>
  <script src="agenda.js"></script>
</body>
</html>
